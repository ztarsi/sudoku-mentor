name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The build must produce a servable page that boots the app and ships
      # the what-if worker as its own chunk.
      - name: Smoke-test the build output
        run: |
          test -f dist/index.html
          grep -q 'id="root"' dist/index.html
          grep -Eq '<script[^>]+type="module"[^>]+src="/assets/' dist/index.html
          ls dist/assets | grep -q 'whatIf.worker'
          test -f dist/favicon.svg
          test -f dist/manifest.webmanifest

      # Budget: all JavaScript in the build, uncompressed. The build is about
      # 750 kB today; raise this number deliberately, not by accident.
      - name: Check the bundle-size budget
        run: |
          total=$(cat dist/assets/*.js | wc -c)
          echo "JavaScript total: $total bytes"
          test "$total" -le 900000
