name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # BUNDLE_BUDGET=1 writes the Vite manifest the budget step reads.
      - name: Build
        run: npm run build
        env:
          BUNDLE_BUDGET: '1'

      # The build must produce a servable page that boots the app and ships
      # the what-if worker as its own chunk.
      - name: Smoke-test the build output
        run: |
          test -f dist/index.html
          grep -q 'id="root"' dist/index.html
          grep -Eq '<script[^>]+type="module"[^>]+src="/assets/' dist/index.html
          ls dist/assets | grep -q 'whatIf.worker'
          test -f dist/favicon.svg
          test -f dist/manifest.webmanifest
          test -f dist/sw.js

      # Budget: what a player downloads before the first board (#91,
      # docs/specs/first-board-payload.md). The script measures the entry
      # chunk, the route that shows the board, and their static imports,
      # and fails if that is over its budget or if the technique engine or
      # the lesson panel has slipped into it. The budget and its reason are
      # written beside the number in scripts/bundle-budget.mjs.
      #
      # The total of all JavaScript is reported, not enforced. It used to be
      # (1,000,000 bytes, last raised for #74), which punished the one change
      # that helps the player: moving code out of the first board does not
      # shrink the total, it adds a few hundred bytes of chunk overhead.
      - name: Check the first-board budget
        run: node scripts/bundle-budget.mjs dist
