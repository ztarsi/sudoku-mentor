name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The build must produce a servable page that boots the app and ships
      # the what-if worker as its own chunk.
      - name: Smoke-test the build output
        run: |
          test -f dist/index.html
          grep -q 'id="root"' dist/index.html
          grep -Eq '<script[^>]+type="module"[^>]+src="/assets/' dist/index.html
          ls dist/assets | grep -q 'whatIf.worker'
          test -f dist/favicon.svg
          test -f dist/manifest.webmanifest
          test -f dist/sw.js

      # Budget: all JavaScript in the build, uncompressed, every chunk
      # counted. The build is about 935 kB today; raise this number
      # deliberately, not by accident.
      #
      # Raised from 900 kB for the uniqueness family (#74), which added
      # 45 kB: an engine, thirteen reference entries and their plain
      # wordings. The coverage programme (#69) is what drives this number,
      # and the two batches left in it will each add tens of kilobytes, so
      # it is worth a look rather than another nudge. Note that splitting
      # code into lazy chunks does not move this total, because it sums
      # every chunk; if what we care about is what a player downloads
      # before the first board, this should measure the entry chunks.
      - name: Check the bundle-size budget
        run: |
          total=$(cat dist/assets/*.js | wc -c)
          echo "JavaScript total: $total bytes"
          test "$total" -le 1000000
