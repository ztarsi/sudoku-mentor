<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sudoku Mentor</title>
    <meta name="description" content="A Sudoku tutor that finds the next logical step on your board and explains it in plain words, from singles to forcing chains." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // The remembered theme, before the first paint, so a paper player
      // never sees a dark flash. Kept in step with src/lib/theme.js.
      (function () {
        try {
          var choice = localStorage.getItem('sudoku-mentor:theme');
          var light = choice === 'paper' || (choice === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.dataset.theme = light ? 'paper' : 'dark';
          document.documentElement.style.colorScheme = light ? 'light' : 'dark';
        } catch (e) { /* default dark */ }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Sudoku Mentor" />
    <meta property="og:description" content="Learn to solve Sudoku by logic. Every hint names the technique, shows the cells, and explains why it works." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
